name: To plan and apply terraform config files on push to main

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/environments/dev/**'
      - 'terraform/modules/**'

defaults: 
  run: # sets the workdir where jobs will be ran 
    working-directory: terraform/environments/dev/

permissions:
  id-token: write
  contents: read

jobs:
  authenticate-plan-apply:
    runs-on: ubuntu-latest
    steps:
      - name: authenticate
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::871145212791:role/Github-Terraform-Role
          aws-region: af-south-1

      - name: get-source-code
        uses: actions/checkout@v6
        
      - name: install-terraform
        uses: hashicorp/setup-terraform@v3

      - name: init
        run: terraform init

      - name: plan
        run: terraform plan -out=plan

      - name: apply
        run: terraform apply --auto-approve




