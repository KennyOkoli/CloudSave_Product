name: Build image, push to ecr and update ecs
on:
  push:
    branches:
      - main
    paths:
      - "application/**"

permissions:
  id-token: write
  contents: read

defaults:
  run:
   working-directory: application/

jobs:
  build_and_test: # This test pulls my repo files including the docker image and runs the node npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cloudsave .
      - run: docker run -p 4000:4000 -d cloudsave
      - run: |
              sleep 15
              curl --fail http://localhost:4000
   
