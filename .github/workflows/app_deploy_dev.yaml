name: Build image, push to ecr and update ecs
on:
  push:
    branches:
      - main
    paths:
      - "application/**"
      - ".github/workflows/app_deploy_dev.yaml"

permissions:
  id-token: write
  contents: read

defaults:
  run:
   working-directory: application/

jobs:
  build_and_test: # This test pulls my repo files including the docker image and runs the node npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        env:
          PORT: 4000
          DB_HOST: cloudsave.czqsco2eaxj9.af-south-1.rds.amazonaws.com
          DB_PORT: 3306
          DB_NAME: CloudSave_db
          DB_USERNAME: Kenny
          DB_PASSWORD: kenny2007
          AWS_REGION: af-south-1
          S3_BUCKET: cloudsave-bucket-871145212791
          APP_ORIGIN: http://localhost:4000
          AWS_PROFILE: JeffRole
          ENABLE_BACKGROUND_JOBS: true
          SKIP_DB_CHECK: false
          SKIP_S3_CHECK: false
          ENABLE_BACKGROUND_JOBS: true
          JWT_SECRET: abcdefghijklmnopqrstuvwxyhiyvjgyukvfgyjm
      - run: docker build -t cloudsave .
      - run: docker run -d --name cloud-debug -p 3000:4000 -e SKIP_DB_CHECK=true -e SKIP_S3_CHECK=true -e ENABLE_BACKGROUND_JOBS=false cloudsave
