name: Build image, push to ecr and update ecs
on:
  push:
    branches:
      - main
    paths:
      - "application/**"
      - ".github/workflows/app_deploy_dev.yaml"

permissions:
  id-token: write
  contents: read

defaults:
  run:
   working-directory: application/

jobs:
  build_and_test: # This test pulls my repo files including the docker image and runs the node npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build-image
        run: docker build -t cloudsave .

      - name: build-test
        run: |
             docker run -d --name cloud-debug -p 3000:4000 -e SKIP_DB_CHECK=true -e JWT_SECRET=abcdefghijklmnopqrstuvwxyhiyvjgyukvfgyjm -e SKIP_S3_CHECK=true -e ENABLE_BACKGROUND_JOBS=false cloudsave
             sleep 3
             docker ps -a
             docker logs cloud-debug

      - name: Test server
        run: |
          for i in $(seq 1 15); do
            if curl -sS http://localhost:3000/ -o /dev/null; then
              echo "Server is reachable"
              exit 0
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' cloud-debug)" != "true" ]; then
              echo "Container exited"
              docker logs cloud-debug
              exit 1
            fi

            sleep 2
          done

          echo "Server did not respond"
          docker logs cloud-debug
          exit 1
      - run: |
              sleep 6
              curl --fail http://localhost:3000
