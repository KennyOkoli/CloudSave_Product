name: Build image, push to ecr and update ecs
on:
  push:
    branches:
      - main
    paths:
      - "application/**"
      - ".github/workflows/app_deploy_dev.yaml"

permissions:
  id-token: write
  contents: read

defaults:
  run:
   working-directory: application/

jobs:
  build_and_test: # This test pulls my repo files including the docker image and runs the node npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        env:
          SKIP_DB_CHECK: false
          SKIP_S3_CHECK: false
          ENABLE_BACKGROUND_JOBS: true
      - run: docker build -t cloudsave .
      - run: |
              sleep 11
              docker run -d --name cloud-debug -p 3000:4000 -e SKIP_DB_CHECK=true -e SKIP_S3_CHECK=true -e ENABLE_BACKGROUND_JOBS=false cloudsave
              sleep 6
              curl --fail http://localhost:3000
